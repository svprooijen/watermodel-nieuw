defaults:
  onverhard:
    opp: 470000
    c: 0.05
    h_init: 0.0
  glasNRL:
    opp: 270000
    c: 0.6
    h_init: 0.0
  glasRL:
    opp: 200000
    c: 0.5
    h_init: 0.0
  openwater:
    opp: 60000
    h_init: 0.0
  bassinNRL:
    h_cur: 0.0
    h_max: 0.1
  bassinRL:
    h_cur: 0.0
    h_max: 0.1
  stuw_pomp:
    met_pomp: 0
    b_stuw: 1.0
    c_stuw: 1.7
    h_kruin_stuw: 0.0
    h_aan_pomp: -0.05
    h_uit_pomp: 0.05
    gemaal_cap: 19 # mm/dag

extra:
  overschrijdingsmarge: 0.3

# Overschrijf default parameters in specifieke gebieden
gebieden:
  - openwater:
      h_init: 1.6
    stuw_pomp:
      b_stuw: 2.0
      h_kruin_stuw: 1.6
  - openwater:
      h_init: 0.7
    stuw_pomp:
      b_stuw: 1.7
      h_kruin_stuw: 0.7
  - openwater:
      h_init: 0.8
    stuw_pomp:
      b_stuw: 2.4
      h_kruin_stuw: 0.8
  - stuw_pomp:
      met_pomp: 1

# [a, b, w]: Water stroomt van gebied 'a' naar gebied 'b'. Mocht één gebied direct naar meerdere andere
# gebieden stromen, dan wordt het water verdeeld volgende de wegingen 'w'.
verbindingen:
  - [0, 2, 1]
  - [2, 3, 1]
  - [1, 3, 1]
  - [0, 3, 2]